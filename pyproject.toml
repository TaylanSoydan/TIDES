[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tides-ssm"
version = "1.0.0"
description = "TIDES: Time-aware Input-Dependent State Space Model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.25", "safetensors>=0.4"]

[project.urls]
Repository = "https://github.com/TaylanSoydan/TIDES"

[tool.setuptools]
packages = ["tides"]
